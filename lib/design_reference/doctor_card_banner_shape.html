<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Doctor card — banner shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --aurora-teal: #2A93C9;
    --aurora-green: #1D9E75;
    --cream: #FAF7F2;
    --ink: #1B2B27;
    --muted: #6B7A76;
    --tonal: #E1F0EC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 16px;
    background: var(--cream);
    font-family: 'Tajawal', sans-serif;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 320px;
    background: #ffffff;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(27,43,39,0.08);
  }
  .banner {
    position: relative;
    height: 150px;
    background: linear-gradient(135deg, var(--aurora-teal), var(--aurora-green));
    overflow: hidden;
  }
  .avatar-wrap {
    display: flex;
    justify-content: center;
    margin-top: -90px;
    position: relative;
    z-index: 2;
  }
  .avatar {
    width: 140px;
    height: 140px;
    border-radius: 26px;
    border: 4px solid #ffffff;
    background: var(--tonal);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Kufi Arabic', sans-serif;
    font-weight: 700;
    font-size: 34px;
    color: var(--aurora-green);
  }
  .body-content { padding: 16px 22px 22px; text-align: center; }
  .name {
    font-family: 'Noto Kufi Arabic', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--ink);
    margin: 4px 0 2px;
  }
  .specialty {
    font-size: 14px;
    color: var(--aurora-green);
    font-weight: 500;
    margin: 0 0 11px;
  }
  .divider { height: 1px; background: rgba(27,43,39,0.08); margin: 0 0 11px; }
  .clinic {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 15px;
  }
  .clinic svg { flex-shrink: 0; }
  .cta {
    display: block;
    width: 100%;
    padding: 13px 0;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, var(--aurora-teal), var(--aurora-green));
    color: #ffffff;
    font-family: 'Noto Kufi Arabic', sans-serif;
    font-weight: 700;
    font-size: 15.5px;
    cursor: pointer;
  }
  .note {
    max-width: 320px;
    margin: 14px auto 0;
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
    font-family: sans-serif;
  }
</style>
</head>
<body>
  <div>
    <div class="card">
      <div class="banner"></div>
      <div class="avatar-wrap">
        <div class="avatar">ح.ط</div>
      </div>
      <div class="body-content">
        <p class="name">د. حسين الطائي</p>
        <p class="specialty">طب عام</p>
        <div class="divider"></div>
        <p class="clinic">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B7A76" stroke-width="2"><path d="M12 21s-7-7.5-7-12a7 7 0 1 1 14 0c0 4.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
          عيادة النظر الواضح
        </p>
        <div class="divider"></div>
        <button class="cta">احجز الآن</button>
      </div>
    </div>
    <p class="note">Banner is back to a raw gradient, no icons. Added the missing second divider — clinic row now sits between two lines, not just one above it.</p>
  </div>
</body>
</html>
